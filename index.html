<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Смелее — практика уверенности</title>
  <style>
    :root {
      --bg: #f5f5f1;
      --paper: #ffffff;
      --ink: #202b28;
      --muted: #59665f;
      --brand: #245d49;
      --brand-dark: #194332;
      --soft: #eaf2ed;
      --line: #dce3dd;
      --warm: #fff4dd;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }

    button, textarea { font: inherit; }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 17px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      min-height: 48px;
    }

    button:hover { background: var(--soft); }

    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      font-weight: 700;
    }

    button.primary:hover { background: var(--brand-dark); }

    button:focus-visible, a:focus-visible, textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid #b46a00;
      outline-offset: 4px;
    }

    a { color: var(--brand); }

    h1, h2, h3 {
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    h1 { font-size: clamp(2.2rem, 6vw, 4rem); }
    h2 { font-size: clamp(1.65rem, 4vw, 2.4rem); }
    h3 { font-size: 1.2rem; }

    p { margin: 0 0 16px; }
    li { margin-bottom: 9px; }

    .skip {
      position: absolute;
      top: -100px;
      left: 16px;
      background: white;
      padding: 12px;
      z-index: 10;
    }

    .skip:focus { top: 10px; }

    .shell {
      max-width: 1060px;
      margin: auto;
      padding: 0 22px;
    }

    header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .brand {
      font-size: 1.45rem;
      font-weight: 850;
      letter-spacing: -.04em;
    }

    .topnav, .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    main { padding-top: 34px !important; padding-bottom: 60px !important; }

    .hero {
      padding: clamp(24px, 5vw, 56px);
      background: var(--soft);
      border-radius: 26px;
      margin-bottom: 24px;
    }

    .hero h1 { max-width: 800px; margin: 12px 0 24px; }
    .hero p { max-width: 720px; }

    .eyebrow {
      color: var(--brand);
      font-size: .85rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .lead { font-size: 1.15rem; }
    .muted, .small { color: var(--muted); }
    .small { font-size: .9rem; }
    .price { font-size: 2rem; font-weight: 800; }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 32px);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid .card { margin-bottom: 0; }

    .notice {
      padding: 18px 20px;
      background: var(--warm);
      border-radius: 14px;
      margin: 20px 0;
    }

    .notice p:last-child, .card p:last-child { margin-bottom: 0; }

    progress {
      display: block;
      width: 100%;
      height: 14px;
      accent-color: var(--brand);
      margin: 14px 0;
    }

    .lesson-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .lesson-list li { margin: 0; }

    .lesson-button {
      width: 100%;
      height: 100%;
      text-align: left;
      padding: 18px;
      background: var(--paper);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .lesson-button strong, .lesson-button small { display: block; }
    .lesson-button small { color: var(--muted); margin-top: 5px; }
    .lesson-button.done { border-color: var(--brand); background: var(--soft); }

    .number {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--soft);
      font-size: .9rem;
      font-weight: 750;
    }

    .reading { max-width: 780px; margin: auto; }
    .reading h2 { margin-top: 12px; }
    .section-label { color: var(--brand); }

    blockquote {
      margin: 18px 0;
      padding: 16px 20px;
      border-left: 4px solid var(--brand);
      background: var(--soft);
      border-radius: 0 12px 12px 0;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 24px 0 8px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 115px;
      padding: 14px;
      color: var(--ink);
      background: #fdfefc;
      border: 1px solid #aab9ae;
      border-radius: 12px;
      resize: vertical;
    }

    .save-status { min-height: 1.6em; margin-top: 12px; }

    details {
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }

    summary { cursor: pointer; font-weight: 700; }
    details p { margin-top: 14px; }
    .spaced { margin-top: 24px; }

    .journal-entry {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 20px;
    }

    .answer {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--soft);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 34px;
    }

    @media (max-width: 680px) {
      body { font-size: 16px; }
      .shell { padding-left: 16px; padding-right: 16px; }
      .grid, .lesson-list { grid-template-columns: 1fr; }
      .topnav { width: 100%; }
      .topnav button { flex: 1; padding: 10px; }
      .actions button { flex: 1 1 180px; }
      .hero { padding: 25px 21px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      button { transition: background .15s ease; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>

  <header>
    <div class="shell topbar">
      <div class="brand">Смелее<span aria-hidden="true">.</span></div>
      <nav class="topnav" aria-label="Главное меню">
        <button type="button" data-view="home">О программе</button>
        <button type="button" data-view="dashboard">Мой путь</button>
        <button type="button" data-view="tools">Подсказки</button>
      </nav>
    </div>
  </header>

  <main id="main" class="shell" tabindex="-1"></main>

  <footer>
    <div class="shell small">
      <p>Не нужно стать бесстрашным. Можно сделать небольшой шаг с волнением.</p>
      <p>
        Записи хранятся только в этом браузере, не синхронизируются между
        устройствами и могут исчезнуть после очистки данных браузера.
        Не оставляйте личные записи на общем устройстве.
      </p>
    </div>
  </footer>

  <noscript>
    Для работы занятий и сохранения ответов необходимо включить JavaScript.
  </noscript>

    const STORAGE_KEY = "smelee-course-v1";
    const main = document.getElementById("main");

    function freshState() {
      return {
        version: 1,
        started: false,
        last: 0,
        done: Array(lessons.length).fill(false),
        notes: {}
      };
    }

    let state = freshState();
    let storageAvailable = true;

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && saved.version === 1) {
          state.started = saved.started === true;
          state.last = Number.isInteger(saved.last)
            ? Math.max(0, Math.min(lessons.length - 1, saved.last))
            : 0;

          if (Array.isArray(saved.done)) {
            state.done = lessons.map((_, i) => saved.done[i] === true);
          }

          if (saved.notes && typeof saved.notes === "object") {
            lessons.forEach((lesson, i) => {
              if (Array.isArray(saved.notes[i])) {
                state.notes[i] = lesson.prompts.map((_, j) =>
                  typeof saved.notes[i][j] === "string"
                    ? saved.notes[i][j].slice(0, 12000)
                    : ""
                );
              }
            });
          }
        }
      }
    } catch {
      storageAvailable = false;
    }

    let currentView = "home";
    let currentLesson = 0;

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        storageAvailable = true;
        return true;
      } catch {
        storageAvailable = false;
        return false;
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function completedCount() {
      return state.done.filter(Boolean).length;
    }

    function storageNotice() {
      return storageAvailable ? "" : `
        <div class="notice" role="status">
          Локальное сохранение сейчас недоступно. Можно проходить занятия,
          но после закрытия страницы записи и прогресс могут пропасть.
        </div>
      `;
    }

    function openView(view, index = 0) {
      currentView = view;
      currentLesson = index;

      if (view === "lesson") {
        state.started = true;
        state.last = index;
        persist();
      }

      const renderers = {
        home: renderHome,
        dashboard: renderDashboard,
        lesson: () => renderLesson(index),
        tools: renderTools,
        journal: renderJournal
      };

      (renderers[view] || renderHome)();

      document.querySelectorAll("[data-view]").forEach(button => {
        const isCurrent = button.dataset.view === view;
        if (isCurrent) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });

      main.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function renderDashboard() {
      const count = completedCount();
      let next = state.last;
      if (state.done[next]) {
        const unfinished = state.done.findIndex(done => !done);
        if (unfinished >= 0) next = unfinished;
      }

      main.innerHTML = `
        <section class="card">
          <span class="eyebrow">Мой путь</span>
          <h1>${count === lessons.length ? "Практика уже стала опытом" : "Один шаг за раз"}</h1>
          <p>

          </p>
          <progress value="${count}" max="${lessons.length}"
            aria-label="Количество отмеченных занятий"></progress>
          <div class="actions">
            <button class="primary" type="button"
              ${count === lessons.length ? 'data-view="journal"' : `data-lesson="${next}"`}>
              ${count === lessons.length ? "Посмотреть свои результаты" : state.started ? "Продолжить практику" : "Начать с первого занятия"}
            </button>
            <button type="button" data-view="journal">Мои записи</button>
          </div>
        </section>

        ${storageNotice()}

        <h2>Занятия</h2>
        <p class="muted">
          Лучше двигаться по порядку, но все темы доступны сразу.
          Пропущенный день ничего не обнуляет.
        </p>

        <ol class="lesson-list">
          ${lessons.map((lesson, i) => `
            <li>
              <button type="button"
                class="lesson-button ${state.done[i] ? "done" : ""}"
                data-lesson="${i}">
                <span class="number" aria-hidden="true">${state.done[i] ? "✓" : i + 1}</span>
                <span>
                  <strong>${i + 1}. ${escapeHTML(lesson.title)}</strong>
                  <small>${escapeHTML(lesson.subtitle)}</small>
                  <small>${state.done[i] ? "Практика отмечена" : "Можно открыть"}</small>
                </span>
              </button>
            </li>
          `).join("")}
        </ol>
      `;
    }

    function renderLesson(index) {
      const lesson = lessons[index];
      const answers = state.notes[index] || [];

      main.innerHTML = `
        <article class="reading">
          <button type="button" data-view="dashboard">← Все занятия</button>
          <div class="spaced">
            <span class="eyebrow">Занятие ${index + 1} из ${lessons.length}</span>
            <h1>${escapeHTML(lesson.title)}</h1>
            <p class="lead">${escapeHTML(lesson.subtitle)}</p>
          </div>

          <section class="card">
            <h2 class="section-label">Зачем это нужно</h2>
            <p>${escapeHTML(lesson.why)}</p>
            <h3>Главная мысль</h3>
            ${lesson.text.map(paragraph => `<p>${escapeHTML(paragraph)}</p>`).join("")}
          </section>

          <section class="card">
            <h2>Упражнение</h2>
            <ol>
              ${lesson.steps.map(step => `<li>${escapeHTML(step)}</li>`).join("")}
            </ol>
            <h3>Шаг в реальной жизни</h3>
            <p>${escapeHTML(lesson.action)}</p>
            <h3>Фраза, на которую можно опереться</h3>
            <blockquote>${escapeHTML(lesson.script)}</blockquote>
          </section>

          <section class="card" aria-labelledby="notes-title">
            <h2 id="notes-title">Мои ответы</h2>
            <p class="small">
              Можно писать кратко. Поля не обязательны.
              Сохранение — только в текущем браузере, без облачной копии.
            </p>

            ${lesson.prompts.map((prompt, j) => `
              <label for="answer-${j}">${escapeHTML(prompt)}</label>
              <textarea id="answer-${j}" data-answer="${j}" maxlength="12000"
                placeholder="Несколько честных предложений для себя…"></textarea>
            `).join("")}

            <p id="save-status" class="small save-status" role="status"></p>
            <button type="button" data-action="save">Сохранить ответы</button>
          </section>

          <section class="card">
            <h2>Когда считать практику выполненной</h2>
            <p>${escapeHTML(lesson.done)}</p>
            <p class="small">
              Если только прочитали занятие, можно вернуться к действию позже.
              Отметка — для вас, не для отчётности.
            </p>
            <div class="actions">
              <button type="button" class="primary" data-action="toggle-done"
                aria-pressed="${state.done[index]}">
                ${state.done[index] ? "Практика отмечена — убрать отметку" : "Отметить практику"}
              </button>
              ${index < lessons.length - 1
                ? `<button type="button" data-lesson="${index + 1}">Следующее занятие →</button>`
                : `<button type="button" data-view="journal">Мои итоги →</button>`}
            </div>
          </section>
          ${storageNotice()}
        </article>
      `;

      main.querySelectorAll("[data-answer]").forEach(field => {
        field.value = answers[Number(field.dataset.answer)] || "";
      });

      document.getElementById("save-status").textContent = storageAvailable
        ? "Изменения сохраняются автоматически в этом браузере."
        : "Сохранение недоступно. Ответы пока останутся только на открытой странице.";
    }

    function renderTools() {
      main.innerHTML = `
        <div class="reading">
          <span class="eyebrow">Под рукой</span>
          <h1>Когда страшно или не хватает слов</h1>

          <section class="card">
            <h2>Быстрая опора перед разговором</h2>
            <ol>
              <li>Назовите происходящее: «Я волнуюсь, потому что это важно».</li>
              <li>Почувствуйте стопы и посмотрите на три предмета вокруг.</li>
              <li>Выберите одно действие: задать вопрос, произнести первую фразу или обозначить просьбу.</li>
              <li>При необходимости уменьшите шаг. Не требуйте от себя полного спокойствия.</li>
            </ol>
            <p>
              Это подсказка для обычного волнения, а не обязательный ритуал.
              Можно начать разговор и без подготовки.
            </p>
          </section>

          <section class="card">
            <h2>Готовые фразы</h2>
            <p class="small">Подстройте формулировки под свой голос и отношения.</p>

            <details open>
              <summary>Начать разговор</summary>
              <p>«Привет! Как тебе сегодняшняя встреча?»</p>
              <p>«Можно уточнить, как это здесь устроено?»</p>
              <p>«Ты упомянул интересную вещь. Расскажешь подробнее?»</p>
            </details>

            <details>
              <summary>Попросить</summary>
              <p>«Можешь уделить мне десять минут сегодня? Нужна помощь с одной задачей».</p>
              <p>«Мне было бы удобнее обсудить это завтра. Тебе подходит?»</p>
            </details>

            <details>
              <summary>Отказать</summary>
              <p>«Нет, сейчас я не готов это взять».</p>
              <p>«Понимаю, что тебе нужно, но сегодня не смогу».</p>
              <p>«Я подумаю и отвечу завтра» — если действительно нужна пауза.</p>
            </details>

            <details>
              <summary>Не согласиться</summary>
              <p>«Я понимаю твою позицию. У меня другой взгляд, потому что…»</p>
              <p>«Предлагаю сравнить варианты по сроку и затратам».</p>
            </details>

            <details>
              <summary>Выдержать паузу или запинку</summary>
              <p>«Секунду, соберу мысль».</p>
              <p>«Скажу точнее: я имею в виду…»</p>
              <p>«Сейчас не знаю ответа. Уточню и вернусь».</p>
            </details>

            <details>
              <summary>Ответить на отказ</summary>
              <p>«Понял, спасибо, что сказал прямо».</p>
              <p>«Хорошо. Тогда я подумаю над другим вариантом».</p>
            </details>

            <details>
              <summary>Ответить на критику</summary>
              <p>«Что именно стоит изменить? Нужен конкретный пример».</p>
              <p>«С этой частью согласен. Вот эту вижу иначе».</p>
              <p>«Готов обсуждать задачу, но не в форме оскорблений».</p>
            </details>

            <details>
              <summary>Завершить разговор</summary>
              <p>«Спасибо за разговор. Мне пора возвращаться к делам».</p>
              <p>«Сейчас не хочу это обсуждать. Вернёмся позже».</p>
            </details>
          </section>

          <section class="card">
            <h2>Если кажется, что ничего не получается</h2>
            <ul>
              <li>Проверьте размер шага: возможно, он пока слишком большой.</li>
              <li>Оцените действие, а не только уровень тревоги.</li>
              <li>Повторите знакомую ступень вместо постоянного усложнения.</li>
              <li>Не используйте один отказ как доказательство «со мной всегда так».</li>
              <li>Если страх существенно мешает жизни, рассмотрите индивидуальную помощь психолога или психотерапевта.</li>
            </ul>
          </section>
        </div>
      `;
    }

    function renderJournal() {
      const written = lessons.map((lesson, i) => ({
        lesson,
        index: i,
        answers: state.notes[i] || []
      })).filter(entry => entry.answers.some(answer => answer.trim()));

      main.innerHTML = `
        <div class="reading">
          <span class="eyebrow">Мои записи</span>
          <h1>Доказательства моих попыток</h1>
          <p>
            Здесь собраны ваши ответы. Ищите не идеальность, а конкретные
            действия: где попросили, попробовали, уточнили или защитили границу.
          </p>

          ${storageNotice()}

          <section class="card">
            <h2>Практика: ${completedCount()} из ${lessons.length}</h2>
            <p>
              Отметки отражают ваш выбор. Они не измеряют психическое
              здоровье, силу характера или личную ценность.
            </p>
            <div class="actions">
              <button type="button" data-view="dashboard">К занятиям</button>
              <button type="button" data-lesson="13">План на следующий месяц</button>
            </div>
          </section>

          <section class="card">
            <h2>Ответы по занятиям</h2>
            ${written.length ? written.map(entry => `
              <article class="journal-entry">
                <h3>${entry.index + 1}. ${escapeHTML(entry.lesson.title)}</h3>
                ${entry.answers.map((answer, j) => answer.trim() ? `
                  <p><strong>${escapeHTML(entry.lesson.prompts[j])}</strong></p>
                  <p class="answer">${escapeHTML(answer)}</p>
                ` : "").join("")}
                <button type="button" data-lesson="${entry.index}">Вернуться к занятию</button>
              </article>
            `).join("") : `
              <p>
                Записей пока нет. Откройте занятие и ответьте хотя бы
                на один вопрос — ответ появится здесь.
              </p>
            `}
          </section>

          <section class="card">
            <h2>Управление данными</h2>
            <p class="small">
              Удаление очистит записи и прогресс этой программы
              в текущем браузере. Восстановления в этом прототипе нет.
            </p>
            <button type="button" data-action="reset">Удалить мои записи и прогресс</button>
          </section>
        </div>
      `;
    }

    function saveCurrentAnswers() {
      if (currentView !== "lesson") return;

      const answers = [];
      main.querySelectorAll("[data-answer]").forEach(field => {
        answers[Number(field.dataset.answer)] = field.value;
      });

      state.notes[currentLesson] = answers;
      const saved = persist();
      const status = document.getElementById("save-status");

      if (status) {
        status.textContent = saved
          ? "Сохранено в этом браузере."
          : "Не удалось сохранить. Не закрывайте страницу, если хотите сохранить видимые ответы.";
      }
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.view) {
        openView(button.dataset.view);
        return;
      }

      if (button.dataset.lesson !== undefined) {
        const index = Number(button.dataset.lesson);
        if (Number.isInteger(index) && index >= 0 && index < lessons.length) {
          openView("lesson", index);
        }
        return;
      }

      if (button.dataset.action === "save") {
        saveCurrentAnswers();
      }

      if (button.dataset.action === "toggle-done") {
        state.done[currentLesson] = !state.done[currentLesson];
        const saved = persist();

        button.setAttribute("aria-pressed", String(state.done[currentLesson]));
        button.textContent = state.done[currentLesson]
          ? "Практика отмечена — убрать отметку"
          : "Отметить практику";

        const status = document.getElementById("save-status");
        if (status) {
          status.textContent = saved
            ? "Прогресс сохранён в этом браузере."
            : "Отметка изменена, но сохранить её после закрытия страницы не удалось.";
        }
      }

      if (button.dataset.action === "reset") {
        const confirmed = window.confirm(
          "Удалить все ответы и отметки этой программы из текущего браузера?"
        );

        if (!confirmed) return;

        try {
          localStorage.removeItem(STORAGE_KEY);
          state = freshState();
          storageAvailable = true;
          openView("dashboard");
        } catch {
          window.alert(
            "Браузер не разрешил удалить сохранённые данные. Используйте настройки данных сайта в браузере."
          );
        }
      }
    });

    main.addEventListener("input", event => {
      if (event.target.matches("[data-answer]")) {
        saveCurrentAnswers();
      }
    });

    if (state.started) {
      currentView = "dashboard";
      renderDashboard();
    } else {
      renderHome();
    }
  </script>
</body>
</html>
